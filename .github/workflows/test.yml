name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn ci

  test-macos-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx -y --min-release-age=0 @guidepup/setup@0.29.3 setup --ci
      - run: yarn install --frozen-lockfile
      - run: yarn test:int:macos

  test-windows-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn test:int:windows

  test-linux-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install --yes xvfb xauth
      - run: yarn install --frozen-lockfile
      - run: xvfb-run --auto-servernum yarn test:int:linux

  example-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx -y --min-release-age=0 @guidepup/setup@0.29.3 setup --ci
      - run: yarn install --frozen-lockfile
      - run: yarn example:macos
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: example-recording-${{ matrix.os }}
          path: recordings/macos-example.mov

  example-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile
      - run: yarn example:windows
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: example-recording-${{ matrix.os }}
          path: recordings/windows-example.mp4

  example-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install --yes xvfb xauth
      - run: yarn install --frozen-lockfile
      - run: xvfb-run --auto-servernum yarn example:linux
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: example-recording-${{ matrix.os }}
          path: recordings/linux-example.mp4
